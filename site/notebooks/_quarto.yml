project:
  type: website

website:
  title: "Eugen Nesbakken"
  navbar:
    background: light
    right:
      - text: "Home"
        href: "https://eugnes03.github.io/personalwebpage/index.html"
      - text: "Blog"
        href: "https://eugnes03.github.io/personalwebpage/blog.html"
      - text: "Portfolio"
        href: "https://eugnes03.github.io/personalwebpage/portfolio.html"
      - text: "CV"
        href: "https://eugnes03.github.io/personalwebpage/cv.html"
      - text: "About"
        href: "https://eugnes03.github.io/personalwebpage/about.html"
  page-footer:
    center: "© 2026 Eugen Nesbakken. All rights reserved."

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 4
    number-sections: true
    highlight-style: github
    code-fold: false
    code-tools: true
    fontsize: 17px
    mainfont: "Source Serif 4"

    include-after-body:
      - text: |
          <script>
          (function(){
            var container = document.querySelector('.navbar-brand-container');
            if(container){
              container.innerHTML = '<a href="https://eugnes03.github.io/personalwebpage/index.html" class="navbar-brand" style="display:flex;align-items:center;"><img src="https://eugnes03.github.io/personalwebpage/assets/images/portrait.jpeg" alt="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;filter:grayscale(35%);border:1px solid #ddd3bf;"><span style="font-style:italic;font-size:15px;margin-left:10px;color:#2b2420;">E. Nesbakken</span></a>';
            }
            var titleBlock = document.querySelector('#title-block-header') || document.querySelector('.quarto-title-banner');
            if (titleBlock && titleBlock.parentNode) {
              var back = document.createElement('a');
              back.href = 'https://eugnes03.github.io/personalwebpage/blog.html';
              back.className = 'back-to-blog';
              back.textContent = '← Back to Blog';
              titleBlock.parentNode.insertBefore(back, titleBlock);
            }
          })();
          </script>

    # MathJax configuration for advanced LaTeX
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
          <script>
          window.MathJax = {
            tex: {
              packages: {'[+]': ['ams', 'physics', 'boldsymbol', 'mathtools', 'cancel']},
              inlineMath: [['$', '$'], ['\\(', '\\)']],
              displayMath: [['$$', '$$'], ['\\[', '\\]']],
              processEscapes: true,
              processEnvironments: true,
              macros: {
                // Common shortcuts
                R: '\\mathbb{R}',
                N: '\\mathbb{N}',
                Z: '\\mathbb{Z}',
                C: '\\mathbb{C}',
                Q: '\\mathbb{Q}',
                F: '\\mathbb{F}',
                // Groups
                GL: '\\operatorname{GL}',
                SL: '\\operatorname{SL}',
                Aut: '\\operatorname{Aut}',
                End: '\\operatorname{End}',
                Hom: '\\operatorname{Hom}',
                Gal: '\\operatorname{Gal}',
                Sym: '\\operatorname{Sym}',
                vec: ['\\mathbf{#1}', 1],
                norm: ['\\left\\lVert #1 \\right\\rVert', 1],
                abs: ['\\left| #1 \\right|', 1],
                inner: ['\\langle #1, #2 \\rangle', 2],
                // Calculus
                dd: ['\\mathrm{d}#1', 1],
                dv: ['\\frac{\\mathrm{d} #1}{\\mathrm{d} #2}', 2],
                pdv: ['\\frac{\\partial #1}{\\partial #2}', 2],
                // Probability
                P: '\\mathbb{P}',
                E: ['\\mathbb{E}\\left[#1\\right]', 1],
                Var: ['\\mathrm{Var}\\left(#1\\right)', 1],
                Cov: ['\\mathrm{Cov}\\left(#1, #2\\right)', 2],
                Prob: ['\\mathbb{P}\\left(#1\\right)', 1]
              }
            },
            loader: {
              load: ['[tex]/ams', '[tex]/physics', '[tex]/boldsymbol', '[tex]/mathtools', '[tex]/cancel']
            },
            chtml: {
              scale: 1,
              minScale: 0.5
            }
          };
          </script>

# For PDF output (if needed)
pdf:
  documentclass: article
  papersize: letter
  geometry:
    - margin=1in
  include-in-header:
    - text: |
        \usepackage{amsmath}
        \usepackage{amssymb}
        \usepackage{amsthm}
        \usepackage{physics}
        \usepackage{mathtools}
        \usepackage{cancel}
        \usepackage{tikz}
        \usetikzlibrary{arrows,positioning,calc,shapes,backgrounds}
