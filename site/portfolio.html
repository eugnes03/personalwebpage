<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Eugen Nesbakken</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/portrait.jpeg" alt="Eugen Nesbakken" class="nav-profile-photo">
            </a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="portfolio.html" class="active">Portfolio</a></li>
                    <li><a href="cv.html">CV</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
                <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Portfolio</h1>
            <p>Writings, papers, and projects</p>
        </header>

        <!-- Category filters -->
        <div id="portfolio-filters" class="pf-filters"></div>

        <!-- Cards -->
        <div id="portfolio-grid" class="pf-grid">
            <p class="portfolio-empty">Loading projects&hellip;</p>
        </div>
    </main>

    <!-- PDF Modal -->
    <div id="pdf-modal" class="pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
        <div class="pdf-modal-inner">
            <div class="pdf-modal-toolbar">
                <span id="pdf-modal-title" class="pdf-modal-title"></span>
                <div class="pdf-modal-actions">
                    <button id="pdf-modal-newtab" class="pdf-modal-btn" title="Open in new tab">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        <span>New tab</span>
                    </button>
                    <a id="pdf-modal-download" class="pdf-modal-btn" title="Download PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Download</span>
                    </a>
                    <button id="pdf-modal-close" class="pdf-modal-btn pdf-modal-close" title="Close (Esc)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <iframe id="pdf-modal-frame" class="pdf-modal-frame" title="PDF viewer"></iframe>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Eugen Nesbakken. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/portfolio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
