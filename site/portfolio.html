<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Eugen Nesbakken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=3">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="assets/images/portrait.jpeg" alt="Eugen Nesbakken" class="nav-profile-photo">
                <span class="logo-word">E. Nesbakken</span>
            </a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="portfolio.html" class="active">Portfolio</a></li>
                    <li><a href="cv.html">CV</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Portfolio</h1>
            <p>Writings, papers, and projects</p>
        </header>

        <!-- Category filters -->
        <div id="portfolio-filters" class="pf-filters"></div>

        <!-- Project list -->
        <div id="portfolio-grid" class="pf-list">
            <p class="portfolio-empty">Loading projects&hellip;</p>
        </div>

        <!-- GitHub Repos -->
        <section class="gh-section">
            <p class="section-label">GitHub</p>
            <div id="gh-grid" class="gh-list">
                <p class="portfolio-empty">Loading repositories&hellip;</p>
            </div>
        </section>
    </main>

    <!-- PDF Modal -->
    <div id="pdf-modal" class="pdf-modal" role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
        <div class="pdf-modal-inner">
            <div class="pdf-modal-toolbar">
                <span id="pdf-modal-title" class="pdf-modal-title"></span>
                <div class="pdf-modal-actions">
                    <button id="pdf-modal-newtab" class="pdf-modal-btn" title="Open in new tab">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        <span>New tab</span>
                    </button>
                    <a id="pdf-modal-download" class="pdf-modal-btn" title="Download PDF">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span>Download</span>
                    </a>
                    <button id="pdf-modal-close" class="pdf-modal-btn pdf-modal-close" title="Close (Esc)">&times;</button>
                </div>
            </div>
            <iframe id="pdf-modal-frame" class="pdf-modal-frame" title="PDF viewer"></iframe>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Eugen Nesbakken</p>
        </div>
    </footer>

    <script src="js/portfolio.js"></script>
    <script src="js/github-repos.js"></script>
</body>
</html>
