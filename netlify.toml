[build]
  command = "bash build.sh"
  publish = "site"

[build.environment]
  JAVA_VERSION = "17"
  NODE_VERSION = "18"

# Cache dependencies between builds for faster deploys
[[plugins]]
  package = "netlify-plugin-cache"
  
  [plugins.inputs]
    paths = [
      ".m2/repository",
      ".cpcache",
      ".clojure/.cpcache"
    ]

# Redirect rules (optional - for clean URLs)
[[redirects]]
  from = "/notebooks/*"
  to = "/notebooks/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false